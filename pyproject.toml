[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggi"
version = "0.1.0"
description = "Graph-based memory intelligence — build, query, and share rich context graphs of your codebase for AI agents and humans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Shudhanshu Pandey" },
]
keywords = ["memory", "graph", "codebase", "context", "ai-agent", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
viz = [
    "pyvis>=0.3.0",
]

[project.scripts]
ggi = "ggi.cli:cli"

[project.urls]
Homepage = "https://github.com/shudhanshu/ggi"
Repository = "https://github.com/shudhanshu/ggi"
Issues = "https://github.com/shudhanshu/ggi/issues"

[tool.hatch.build.targets.wheel]
packages = ["ggi"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
